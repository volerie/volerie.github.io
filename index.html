<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>@volerie</title>

  <style>
    /* --- Paper + typewriter minimal aesthetic --- */
    :root{
      --paper: #f7f3ea;
      --ink: #1f1f1f;
      --muted: rgba(0,0,0,.62);
      --hairline: rgba(0,0,0,.18);
      --max: 760px;
    }

    *{ box-sizing: border-box; }

    html, body { height: 100%; }

    body{
      margin: 0;
      color: var(--ink);
      font-family: "Courier New", Courier, monospace;
      background: var(--paper);
      line-height: 1.55;
    }

    /* Paper texture (no image needed):
       - soft vignette
       - subtle fiber noise via repeating gradients
       - faint speckles
    */
    body::before{
      content:"";
      position: fixed;
      inset: 0;
      z-index: -1;

      background:
        /* vignette */
        radial-gradient(1200px 800px at 50% 30%, rgba(0,0,0,0.04), transparent 55%),
        radial-gradient(1000px 700px at 50% 85%, rgba(0,0,0,0.05), transparent 60%),

        /* paper fibers */
        repeating-linear-gradient(
          0deg,
          rgba(0,0,0,0.012),
          rgba(0,0,0,0.012) 1px,
          transparent 1px,
          transparent 6px
        ),
        repeating-linear-gradient(
          90deg,
          rgba(0,0,0,0.010),
          rgba(0,0,0,0.010) 1px,
          transparent 1px,
          transparent 10px
        ),

        /* speckles */
        radial-gradient(circle at 10% 20%, rgba(0,0,0,0.035) 0 1px, transparent 2px),
        radial-gradient(circle at 70% 40%, rgba(0,0,0,0.030) 0 1px, transparent 2px),
        radial-gradient(circle at 35% 78%, rgba(0,0,0,0.028) 0 1px, transparent 2px),
        radial-gradient(circle at 88% 72%, rgba(0,0,0,0.030) 0 1px, transparent 2px);

      /* Make the speckles repeat across the page */
      background-size:
        auto,
        auto,
        auto,
        auto,
        240px 240px,
        280px 280px,
        260px 260px,
        300px 300px;

      mix-blend-mode: multiply;
      opacity: 0.85;
    }

    .wrap{
      max-width: var(--max);
      margin: 0 auto;
      padding: 56px 20px 72px;
    }

    header{
      margin-bottom: 32px;
    }

    .title{
      font-size: 28px;
      letter-spacing: 0.2px;
      margin: 0 0 8px;
      font-weight: 700;
    }

    .subtitle{
      margin: 0;
      color: var(--muted);
      font-size: 15px;
    }

    a{
      color: var(--ink);
      text-decoration: none;
      border-bottom: 1px solid var(--hairline);
      padding-bottom: 1px;
    }
    a:hover{
      border-bottom-color: rgba(0,0,0,.5);
    }

    .block{
      margin: 28px 0;
      padding-top: 18px;
      border-top: 1px solid var(--hairline);
    }

    h2{
      font-size: 16px;
      margin: 0 0 10px;
      font-weight: 700;
      letter-spacing: .2px;
    }

    p{
      margin: 0 0 10px;
    }

    ul{
      margin: 0;
      padding-left: 20px;
    }

    li{
      margin: 6px 0;
    }

    .muted{
      color: var(--muted);
    }

    footer{
      margin-top: 34px;
      padding-top: 18px;
      border-top: 1px solid var(--hairline);
      font-size: 13px;
      color: var(--muted);
    }

    /* Small “typewriter” cursor effect on the title (subtle) */
    .cursor::after{
      content: "▮";
      margin-left: 6px;
      opacity: .65;
      animation: blink 1.1s steps(1) infinite;
    }
    @keyframes blink{
      50%{ opacity: 0; }
    }

    /* Optional: make it feel like a centered page on a desk */
    @media (min-width: 900px){
      .wrap{
        background: rgba(255,255,255,0.10);
        border: 1px solid rgba(0,0,0,0.08);
        box-shadow: 0 20px 70px rgba(0,0,0,0.10);
        padding: 64px 56px 78px;
        margin-top: 28px;
        margin-bottom: 40px;
      }
    }
  </style>
</head>

<body>
  <main class="wrap">
    <header>
      <h1 class="title cursor">@volerie</h1>
      <p class="subtitle">  

    </header>

    <section id="about" class="block">
      <h2>about</h2>
      <p>
        Add stuff here later!!
      </p>
      <p class="muted">
        Testing testing 123
      </p>
    </section>

    <section id="reading" class="block">
      <h2>reading</h2>
      
    </section>

    <section id="projects" class="block">
      <h2>projects</h2>
      <p>
        Add stuff here later!!
      </p>
      <p class="muted">
        Testing testing 123
      </p>
    </section>

	<section id="art" class="block">
      <h2>art</h2>
      <p>
        Add stuff here later!!
      </p>
      <p class="muted">
        Testing testing 123
      </p>
    </section>
	  
    <section id="contact" class="block">
      <h2>contact</h2>
      <p>
        email: <a href="mailto:you@example.com">you@example.com</a><br />
        linkedin: <a href="https://www.linkedin.com/in/your-handle" target="_blank" rel="noreferrer">your-handle</a>
      </p>
    </section>

    <footer>
      <span>© <span id="year"></span> volerie</span>
      <span class="muted"> · built by ME!!</span>
    </footer>
  </main>

  <script>
    document.getElementById("year").textContent = new Date().getFullYear();
  </script>
</body>
</html>
